function clean(o){const d=dflt();if(!o||typeof o!=='object')return d;const r=Object.assign(d,o);r.set=Object.assign(dflt().set,o.set);r.eq=Object.assign(dflt().eq,o.eq);

 if(!r.baits||typeof r.baits!=='object')r.baits={};if(!r.fish||typeof r.fish!=='object')r.fish={};r.coins=Math.max(0,+r.coins||0);r.wx=cl(+r.wx||0,0,3);return r}
function load(){for(const k of[K,KB]){try{const s=localStorage.getItem(k);if(s)return clean(JSON.parse(s))}catch(e){}}return dflt()}
function save(){try{const c=localStorage.getItem(K);if(c)localStorage.setItem(KB,c);localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load();const IM={};['bg','f1','f2','f3','f4','f5','f6'].forEach(n=>{const i=new Image();i.onload=()=>IM[n]=i;i.src='assets/'+n+(n==='bg'?'.jpg':'.png')});

const splash=()=>{tone(500,.25,'sawtooth',.05,-400)};

// ---- state ----
const cv=$('c'),ctx=cv.getContext('2d');let W,H,dpr;

let st='idle',pw=0,ct=0,tm=0,landD=8,landX=0,bob={x:0,y:0},fg=null,fi=null,fw=0,rl=false,hk=0,shake=0,rip=[],nrip=0,pop=false,rain=[];
for(let i=0;i<70;i++)rain.push({x:R(),y:R(),s:.6+R()});

const tip=()=>({x:W*.6,y:H*.6});

// ---- fight ----
function pick(a,sta,ag){const w=[.3,.35+ag*.2,ag*.3*sta,.15+(1-sta)*.4];let r=R()*w.reduce((x,y)=>x+y),i=0;while(i<3&&r>=w[i]){r-=w[i];i++}
 const D=[[1,2.2,.3,.45],[1,2,.55,.8],[.4,.9,.95,1],[.8,1.6,.1,.1]][i];a.mv=i;a.tm=lp(D[0],D[1],R());a.tf=lp(D[2],D[3],R());a.tl=i==3?0:(R()<.5?-1:1)*lp(.3,1,R())}
function newFight(f,w){const rod=eq('rod'),lim=Math.max(.1,rod.mw),over=w>lim?1+.5*(w-lim)/lim:1,wf=.6+.6*Math.min(1,w/lim);
 const a={mv:0,tm:0,f:0,l:0,tf:0,tl:0};pick(a,1,f.agg);return{a,fi:f,str:f.df*wf*over,wf,reel:eq('reel'),line:eq('line'),raw:.3,ten:.3,dist:1,sta:1,brk:0,sl:0}}
function fTick(f,dt,r){const a=f.a;a.tm-=dt;if(a.tm<=0)pick(a,f.sta,f.fi.agg);const rt=(a.mv==2?6:2)*dt;a.f+=cl(a.tf-a.f,-rt,rt);a.l+=cl(a.tl-a.l,-2.5*dt,2.5*dt);

 f.dist=cl(f.dist+(r?-f.reel.spd*(1-cl(fo*.7,0,1))*dt:fo*f.fi.spd*.06*dt),0,1);

function cast(){if(st!=='idle'||pop)return;st='charge';ct=0;pw=0;tone(300,.08,'square',.05)}
function release(){if(st!=='charge')return;const b=eq('bait');if(!b.inf){if((S.baits[b.id]||0)>0)S.baits[b.id]--;else{S.eq.bait='bait1';toast('Out of bait - using Worm')}}
 const rod=eq('rod');landD=lp(3,rod.cast,pw);landX=(R()*2-1)*(1-rod.acc)*W*.12;bob.x=W/2+landX;bob.y=by(landD);tm=.8;st='cast';tone(900,.3,'sine',.05,-600);vib(15);save()}
function weight(f){const b=eq('bait');let w=f.bite;if(S.wx==3)w*=f.rain;if(f.fav===b.id)w*=2;if(f.r>=2)w*=1+b.rb;return w}
function waitT(){const b=eq('bait');if(!S.tut)return lp(1.5,2.5,R());return lp(3,8,R())/(b.bm*(S.wx==3?1.2:1))}

function hook(){if(st==='bite'){fg=newFight(fi,fw);st='fight';tone(200,.15,'square',.1);vib(60)}else if(st==='waiting'){st='idle'}}
function endFight(res){rl=false;fg=null;if(res==='land')return land();st='idle';toast(res==='break'?'Line broke!':'It got away...');vib(res==='break'?250:0)}
function land(){const l=lp(fi.l[0],fi.l[1],cl((fw-fi.w[0])/(fi.w[1]-fi.w[0]||1),0,1)),c=Math.max(1,Math.round(fw*fi.cpk));
 const rec=S.fish[fi.id]||(S.fish[fi.id]={n:0,bw:0,bl:0}),ns=rec.n===0,pb=!ns&&fw>rec.bw;rec.n++;rec.bw=Math.max(rec.bw,fw);rec.bl=Math.max(rec.bl,l);S.coins+=c;S.total++;S.tut=true;save();
 [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.1),i*110));vib([80,40,120]);st='caught';pop=true;
 $('pc').innerHTML='<canvas id="fc" width="260" height="110"></canvas><h2>'+fi.n+'</h2><b style="color:'+RC[fi.r]+'">'+RN[fi.r]+'</b><p>'+fw.toFixed(2)+' kg &middot; '+Math.round(l)+' cm<br>+'+c+' coins</p>'+(ns?'<h3 style="color:#fc3">NEW FISH DISCOVERED!</h3>':'')+(pb?'<h3 style="color:#6f6">NEW RECORD!</h3>':'')+'<button data-a="ack">Continue</button>';
 $('p').style.display='flex';const x=$('fc').getContext('2d');IM[fi.id]?fitImg(x,IM[fi.id]):drawFish(x,130,55,150,fi.c,1)}
function shade(h,f){const n=parseInt(h.slice(1),16),m=f<0?0:255,k=Math.abs(f),q=v=>Math.round(v+(m-v)*k);return'rgb('+q(n>>16)+','+q(n>>8&255)+','+q(n&255)+')'}
function drawFish(c,x,y,L,col,a){const h=L*.22;c.save();c.globalAlpha=a;c.translate(x,y);
 c.fillStyle=shade(col,-.25);c.beginPath();c.moveTo(-L*.4,0);c.quadraticCurveTo(-L*.6,-h*1.1,-L*.64,-h*1.3);c.quadraticCurveTo(-L*.52,0,-L*.64,h*1.3);c.quadraticCurveTo(-L*.6,h*1.1,-L*.4,0);c.fill();
 if(a<.5){c.beginPath();c.ellipse(0,0,L*.46,h*.85,0,0,7);c.fill();c.restore();return}
 c.beginPath();c.moveTo(-L*.15,-h*.85);c.quadraticCurveTo(0,-h*1.6,L*.15,-h*.9);c.fill();

 c.save();c.clip();c.strokeStyle='rgba(255,255,255,.13)';c.lineWidth=1;for(let i=-3;i<9;i++)for(let j=-3;j<4;j++){c.beginPath();c.arc(-L*.3+i*L*.065+(j&1?L*.032:0),j*h*.28,L*.04,-1.2,1.2);c.stroke()}

// ---- update ----
function update(dt){
 if(st==='charge'){ct+=dt/1.1;pw=1-Math.abs(ct%2-1)}

 else if(st==='fight'){const r=fTick(fg,dt,rl);if(rl&&(performance.now()|0)%100<17)tone(300,.03,'square',.03);

 else shake=0;

}

 ctx.fillStyle=wx>1?'rgba(255,255,255,.55)':'rgba(255,255,255,.35)';for(let i=0;i<5;i++){const cx=((t*.004*(1+i*.2)+i*W*.3)%(W+200))-100,cy=.05*H+i*.04*H;for(let k=0;k<4;k++){ctx.beginPath();ctx.ellipse(cx+k*28,cy+(k%2)*6,40,14,0,0,7);ctx.fill()}}

 for(let i=0;i<5;i++){const x=W*(.3+i*.1),y=.31*H;ctx.fillStyle='#d8c8a8';ctx.fillRect(x,y,16,12);ctx.fillStyle='#a0522d';ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x+8,y-9);ctx.lineTo(x+19,y);ctx.fill()}
 for(const x of[.06,.93,.2,.78]){const big=x<.1||x>.9,tx=W*x,tb=.37*H,th=big?.17*H:.09*H;ctx.fillStyle='#4a3524';ctx.fillRect(tx-(big?7:4),tb-th,big?14:8,th);for(let k=0;k<6;k++){const bx2=tx+Math.sin(k*2.1)*(big?30:18),by2=tb-th-k*(big?8:5)+(k%2)*6,rr=big?32:20,rg=ctx.createRadialGradient(bx2-8,by2-8,3,bx2,by2,rr);rg.addColorStop(0,wx==1?'#4a7a3a':'#7fbf5a');rg.addColorStop(1,wx==1?'#1f3a22':'#2f6a30');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(bx2,by2,rr,0,7);ctx.fill()}}

// ---- HUD ----
const HT={idle:'Hold CAST, release to throw',charge:'Release to cast!',cast:'',waiting:'Wait for a bite...',bite:'BITE! Tap HOOK now!',fight:'Hold REEL. Let go when the line turns red!',caught:''};
function hud(){$('co').textContent='Coins '+S.coins;$('wc').textContent=WN[S.wx];
 const cb=$('cb'),m=$('mw'),mf=$('mf');cb.textContent={idle:'CAST',charge:'RELEASE',waiting:'PULL IN',bite:'HOOK!'}[st]||'...';cb.style.background=st==='bite'?'#d9482b':'';

 m.style.display=st==='charge'||st==='fight'?'block':'none';
 if(st==='charge'){$('ml').textContent='POWER';mf.style.width=pw*100+'%';mf.style.background='#4ab0e0'}
 if(st==='fight'){$('ml').textContent='LINE TENSION';mf.style.width=cl(fg.ten,0,1)*100+'%';mf.style.background=fg.ten>=.8?'#e03030':fg.ten<.15?'#4ab0e0':'#4cc46a';$('df').style.width=(1-fg.dist)*100+'%'}}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(!pop)update(dt);draw(t);hud();requestAnimationFrame(loop)}
// ---- panels ----
function open(h){$('pc').innerHTML=h;$('p').style.display='flex'}function close(){$('p').style.display='none';pop=false}
function menu(){open('<h1>MINI FISHING</h1><small>by PRALAY</small><button class="m" data-a="close">PLAY</button><button class="m" data-a="col">Fish Collection</button><button class="m" data-a="up">Upgrades</button><button class="m" data-a="set">Settings</button>')}
function col(){let h='<h2>Fish Collection</h2><div class="gr">';for(const f of F){const r=S.fish[f.id];h+='<div class="cd">'+(r?'<b>'+f.n+'</b><small style="color:'+RC[f.r]+'">'+RN[f.r]+'</small><small>Best '+r.bw.toFixed(2)+' kg / '+Math.round(r.bl)+' cm</small><small>Caught '+r.n+'</small>':'<b>???</b><small>'+RN[f.r]+'</small><small>Not found yet</small>')+'</div>'}open(h+'</div><button class="m" data-a="menu">Back</button>')}
function up(){let h='<h2>Upgrades</h2><p>Coins: '+S.coins+'</p>';
 for(const[k,nm,A]of[['rod','Rods',ROD],['reel','Reels',REEL],['line','Lines',LINE],['bait','Bait',BAIT]]){h+='<h3>'+nm+'</h3>';
  for(const it of A){const own=S.own.includes(it.id),on=S.eq[k]===it.id;let b='';
   if(it.pk){b='<button data-a="buy" data-k="'+k+'" data-i="'+it.id+'">'+it.pk+' for '+it.p+'</button>'+((S.baits[it.id]||0)>0&&!on?'<button data-a="eq" data-k="'+k+'" data-i="'+it.id+'">Use</button>':'')}
   else if(it.inf)b=on?'In use':'<button data-a="eq" data-k="'+k+'" data-i="'+it.id+'">Use</button>';
   else b=on?'Equipped':own?'<button data-a="eq" data-k="'+k+'" data-i="'+it.id+'">Equip</button>':'<button data-a="buy" data-k="'+k+'" data-i="'+it.id+'">'+it.p+'</button>';
   h+='<div class="row"><div><b>'+it.n+'</b><small>'+it.d+(it.pk?' (have '+(S.baits[it.id]||0)+')':'')+'</small></div><div>'+b+'</div></div>'}}
 open(h+'<button class="m" data-a="menu">Back</button>')}
function setp(){open('<h2>Settings</h2><button class="m" data-a="snd">Sound: '+(S.set.snd?'ON':'OFF')+'</button><button class="m" data-a="vib">Vibration: '+(S.set.vib?'ON':'OFF')+'</button><button class="m" style="background:#7a2a2a" data-a="reset">Reset progress</button><button class="m" data-a="menu">Back</button>')}
$('p').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,k=b.dataset.k,A={rod:ROD,reel:REEL,line:LINE,bait:BAIT}[k];
 if(a==='close')close();else if(a==='ack'){close();st='idle'}else if(a==='menu')menu();else if(a==='col')col();else if(a==='up')up();else if(a==='set')setp();
 else if(a==='snd'){S.set.snd=!S.set.snd;save();setp()}else if(a==='vib'){S.set.vib=!S.set.vib;save();setp();vib(60)}
